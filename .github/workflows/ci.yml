name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    # `bash -eo pipefail`, so a failed `curl | sh` fails the step.
    shell: bash

jobs:
  checks:
    name: Format and host tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # Match the Bun used to produce bun.lock.
      BUN_VERSION: 1.3.14
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      # prettier --check over the repo root and tests/ (web/ is in .prettierignore).
      - run: bun run format

      # Installs the channel and components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      - run: cargo fmt --all -- --check

      # Host unit tests (pure logic); the on-chain suite runs in the `anchor` job.
      - run: cargo test -p opal

  anchor:
    name: Anchor build and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Keep SOLANA_VERSION in sync with [toolchain].solana_version in Anchor.toml
      # and ANCHOR_VERSION with the anchor-lang pin in programs/opal/Cargo.toml.
      BUN_VERSION: 1.3.14
      SOLANA_VERSION: 3.1.13
      ANCHOR_VERSION: 1.1.2
      # sha256 of the x86_64-unknown-linux-gnu asset of the Anchor v1.1.2 GitHub release.
      ANCHOR_SHA256: fdea9979629e9416e5f5e5622ff6c11b8c691d1e559581ece368e903c0c980c1
      SURFPOOL_VERSION: 1.4.0
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - run: bun install --frozen-lockfile

      - name: Install Rust toolchain
        run: rustup toolchain install --no-self-update

      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true

      # The Solana install and the SBF platform-tools (downloaded by the first
      # `anchor build`) are saved together at the end of a successful run.
      - name: Cache Solana toolchain
        id: solana-cache
        uses: actions/cache@v6
        with:
          path: |
            ~/.cache/solana
            ~/.local/share/solana
          key: solana-${{ runner.os }}-${{ env.SOLANA_VERSION }}

      - name: Install Solana CLI
        if: steps.solana-cache.outputs.cache-hit != 'true'
        run: curl -sSfL "https://release.anza.xyz/v${SOLANA_VERSION}/install" | sh

      - name: Add Solana CLI to PATH
        run: echo "$HOME/.local/share/solana/install/active_release/bin" >> "$GITHUB_PATH"

      # Prebuilt release binary (what `avm install` downloads), checksum-pinned,
      # so no avm/cargo compile is needed.
      - name: Install Anchor CLI
        run: |
          mkdir -p "$HOME/.local/bin"
          curl -fsSL --retry 5 --retry-all-errors \
            -o "$HOME/.local/bin/anchor" \
            "https://github.com/otter-sec/anchor/releases/download/v${ANCHOR_VERSION}/anchor-${ANCHOR_VERSION}-x86_64-unknown-linux-gnu"
          echo "${ANCHOR_SHA256}  $HOME/.local/bin/anchor" | sha256sum --check
          chmod +x "$HOME/.local/bin/anchor"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      # Official installer, pinned with VERSION. Run from a temp dir because it
      # downloads and extracts in the current directory.
      - name: Install surfpool
        working-directory: ${{ runner.temp }}
        run: curl -sSfL https://run.surfpool.run/ | VERSION="v${SURFPOOL_VERSION}" SHELL=/bin/bash bash

      - name: Verify tool versions
        run: |
          solana --version | grep -F "solana-cli ${SOLANA_VERSION} "
          anchor --version | grep -Fx "anchor-cli ${ANCHOR_VERSION}"
          surfpool --version | grep -F "${SURFPOOL_VERSION}"
          bun --version | grep -Fx "${BUN_VERSION}"

      # Anchor.toml's provider wallet. Nothing is funded or signed with it
      # outside the local surfpool network.
      - name: Create throwaway wallet
        run: |
          mkdir -p "$HOME/.config/solana"
          solana-keygen new --no-bip39-passphrase --silent --outfile "$HOME/.config/solana/id.json"

      - run: anchor build

      # `anchor test` starts surfpool itself (default validator) and runs the
      # [scripts].test command from Anchor.toml.
      - run: anchor test --skip-build
